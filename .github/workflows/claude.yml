# Reusable workflow: Claude on GitHub. Answers @claude in issues, PR comments and reviews; can
# build and test with the Android toolchain, push commits or open a PR. Runs on the author's Claude
# subscription (CLAUDE_CODE_OAUTH_TOKEN, passed by the caller); without it the job does nothing.
# Only users with write access (and no bots) can trigger it: claude-code-action checks both.
name: Claude

on:
  workflow_call:
    inputs:
      java-version:
        description: JDK used by the build
        type: string
        default: '17'
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false

env:
  JAVA_VERSION: ${{ inputs.java-version }}

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # lets Claude read CI results on PRs
    env:
      HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - name: Missing secret
        if: env.HAS_TOKEN != 'true'
        run: echo "::notice::CLAUDE_CODE_OAUTH_TOKEN is not set; see docs/claude.md. Skipping."

      - name: Checkout
        if: env.HAS_TOKEN == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # The same toolchain as Android CI, so Claude can run the checks it changes.
      - name: Set up JDK
        if: env.HAS_TOKEN == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        if: env.HAS_TOKEN == 'true'
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        if: env.HAS_TOKEN == 'true'
        uses: gradle/actions/setup-gradle@v6

      - name: Run Claude Code
        if: env.HAS_TOKEN == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # --max-turns caps how much of the subscription one mention can use.
          claude_args: |
            --max-turns 40
            --allowedTools "Bash(./gradlew *),Bash(chmod +x gradlew)"
