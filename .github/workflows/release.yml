# Reusable workflow: Release.
#
# Manual-only release: cuts the app module's versionName/versionCode and
# CHANGELOG.md's [Unreleased] section for the version given in the dispatch
# form (as local, uncommitted edits), builds and signs the release APK
# against those edits, and only once the GitHub Release is actually
# published does it commit and push the version bump straight to main. This
# order is deliberate: if the build/signing step fails (e.g. a bad keystore
# password), main is never touched and the same version input can simply be
# re-run once the underlying problem is fixed — nothing is "spent" on a
# failed attempt (an earlier commit-before-build order failed for real in
# one of the projects).
# The version is either typed (`version`, x.y.z) or computed from the current versionName by
# `bump` (minor by default: 1.4.2 -> 1.5.0). GitHub's dispatch form can't pre-fill a value computed
# from repo state, so the form offers the bump and the run prints the number it chose. Either way it
# must be greater than the current versionName. The workflow still refuses to overwrite an existing
# release/tag. The GitHub Release body is never the full cut section - see "Extract changelog
# highlights" below for what actually gets published, and the kit's docs/ci.md for the CHANGELOG
# entry convention it depends on.
#
# Last thing it does, only after a successful release: delete the completed runs of every workflow
# except Release and Build APK (of which the latest successful one is kept). See "Clean up old runs".
#
# Reusable workflow, called by each project's .github/workflows/release.yml with the version typed
# in the dispatch form. The release title and the APK name come from the calling repository's name.
name: Release

on:
  workflow_call:
    inputs:
      version:
        description: 'Exact version x.y.z (overrides bump; must be greater than the current versionName). Empty: computed from bump'
        required: false
        type: string
        default: ''
      bump:
        description: 'Which part of the current versionName to increase when version is empty: minor (1.4.2 -> 1.5.0), patch (1.4.3), major (2.0.0)'
        required: false
        type: string
        default: minor
      app-module:
        description: Gradle module of the application
        type: string
        default: app
      java-version:
        description: JDK used by the build
        type: string
        default: '17'
    secrets:
      RELEASE_KEYSTORE_BASE64:
        required: false
      RELEASE_KEYSTORE_PASSWORD:
        required: false
      RELEASE_KEY_ALIAS:
        required: false
      RELEASE_KEY_PASSWORD:
        required: false
      RELEASE_PUSH_TOKEN:
        required: false
      BUILD_ENV:
        description: Optional KEY=VALUE lines exported to the build environment
        required: false

# No `permissions:` here on purpose: the token gets what the caller grants. The caller gives
# `contents: write` (version bump, release) and `actions: write` (clean up old runs); a caller that
# lacks the second still releases, only the cleanup step warns and skips.

# Two releases at once would race on the version bump pushed to main.
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

env:
  APP_MODULE: ${{ inputs.app-module }}
  JAVA_VERSION: ${{ inputs.java-version }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # Before anything else: without the secrets the errors come late and are obscure.
      - name: Check secrets
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_PUSH_TOKEN: ${{ secrets.RELEASE_PUSH_TOKEN }}
        run: |
          MISSING=""
          for name in RELEASE_KEYSTORE_BASE64 RELEASE_KEYSTORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD RELEASE_PUSH_TOKEN; do
            [ -n "${!name}" ] || MISSING="$MISSING $name"
          done
          if [ -n "$MISSING" ]; then
            echo "Missing repository secrets:$MISSING (Settings → Secrets and variables → Actions)" >&2
            exit 1
          fi

      # Uses a PAT (not the default GITHUB_TOKEN) so the version-bump commit below authenticates
      # as an actual repo admin and can bypass main's branch protection — GITHUB_TOKEN pushes are
      # attributed to the github-actions[bot] identity, which isn't covered by an "admins bypass
      # required pull requests" exception. RELEASE_PUSH_TOKEN is a fine-grained PAT scoped to just
      # this repo's Contents (read/write), stored as a repo secret.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.RELEASE_PUSH_TOKEN }}

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Works out the version (typed, or the current one bumped), validates it, then cuts
      # CHANGELOG.md's [Unreleased] section into a dated "## [x.y.z]" one (leaving a fresh empty
      # [Unreleased] above it) and bumps the app module's versionName/versionCode (+1) to match -
      # the same two edits a human previously made by hand before running this workflow. Fails the
      # whole run before touching any file if the version isn't a plain x.y.z, isn't greater than the
      # current versionName, or the changelog has nothing new to release, since a bad input at this
      # point would otherwise commit garbage to main.
      - name: Validate and apply version bump
        env:
          INPUT_VERSION: ${{ inputs.version }}
          BUMP: ${{ inputs.bump }}
          BUILD_FILE: ${{ env.APP_MODULE }}/build.gradle.kts
        run: |
          CURRENT_VERSION=$(grep -m1 'versionName = ' "$BUILD_FILE" | sed -E 's/.*versionName = "([^"]*)".*/\1/')
          CURRENT_CODE=$(grep -m1 'versionCode = ' "$BUILD_FILE" | sed -E 's/.*versionCode = ([0-9]+).*/\1/')
          if [ -z "$CURRENT_VERSION" ] || [ -z "$CURRENT_CODE" ]; then
            echo "Could not read versionName/versionCode from $BUILD_FILE" >&2
            exit 1
          fi

          if [ -n "$INPUT_VERSION" ]; then
            NEW_VERSION="$INPUT_VERSION"
          else
            if [[ ! "$CURRENT_VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              echo "Cannot bump '$CURRENT_VERSION' automatically (not x.y.z): type the version." >&2
              exit 1
            fi
            MAJOR=${BASH_REMATCH[1]}; MINOR=${BASH_REMATCH[2]}; PATCH=${BASH_REMATCH[3]}
            case "$BUMP" in
              major) NEW_VERSION="$((MAJOR + 1)).0.0" ;;
              minor) NEW_VERSION="${MAJOR}.$((MINOR + 1)).0" ;;
              patch) NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))" ;;
              *) echo "bump must be major, minor or patch (got: '$BUMP')" >&2; exit 1 ;;
            esac
          fi
          echo "Releasing $NEW_VERSION (current: $CURRENT_VERSION)"
          echo "Releasing **$NEW_VERSION** (current: $CURRENT_VERSION)" >> "$GITHUB_STEP_SUMMARY"

          if [[ ! "$NEW_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "version must look like x.y.z (got: '$NEW_VERSION')" >&2
            exit 1
          fi

          HIGHEST=$(printf '%s\n%s\n' "$CURRENT_VERSION" "$NEW_VERSION" | sort -V | tail -1)
          if [ "$NEW_VERSION" = "$CURRENT_VERSION" ] || [ "$HIGHEST" != "$NEW_VERSION" ]; then
            echo "version ($NEW_VERSION) must be greater than the current versionName ($CURRENT_VERSION)" >&2
            exit 1
          fi

          UNRELEASED_BODY=$(awk '/^## \[Unreleased\]$/{flag=1; next} /^## \[/{flag=0} flag' CHANGELOG.md | sed '/^[[:space:]]*$/d')
          if [ -z "$UNRELEASED_BODY" ]; then
            echo "CHANGELOG.md's [Unreleased] section is empty - nothing to release. Add entries first." >&2
            exit 1
          fi

          NEW_CODE=$((CURRENT_CODE + 1))
          TODAY=$(date -u +%F)

          awk -v newsec="## [$NEW_VERSION] - $TODAY" '
            /^## \[Unreleased\]$/ { print; print ""; print newsec; next }
            { print }
          ' CHANGELOG.md > CHANGELOG.md.tmp && mv CHANGELOG.md.tmp CHANGELOG.md

          sed -i -E "s/versionCode = [0-9]+/versionCode = $NEW_CODE/" "$BUILD_FILE"
          sed -i -E "s/versionName = \"[^\"]*\"/versionName = \"$NEW_VERSION\"/" "$BUILD_FILE"

      # Single source of truth for the release version: the app module's versionName,
      # now freshly bumped by the step above (still only a local, uncommitted edit at this
      # point — see the top-of-file comment for why the commit/push is deferred to the end).
      - name: Read app version
        id: version
        env:
          BUILD_FILE: ${{ env.APP_MODULE }}/build.gradle.kts
        run: |
          VERSION_NAME=$(grep -m1 'versionName = ' "$BUILD_FILE" | sed -E 's/.*versionName = "([^"]*)".*/\1/')
          if [ -z "$VERSION_NAME" ]; then
            echo "Could not read versionName from $BUILD_FILE" >&2
            exit 1
          fi
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Refuse to overwrite an existing release
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists. Bump versionName in the app module's build.gradle.kts and add a matching CHANGELOG.md entry before running this workflow again." >&2
            exit 1
          fi

      # Persistent release keystore (never the ephemeral debug.keystore), see docs/ci.md.
      - name: Decode release keystore
        run: echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}

      # Extra build-time environment for this project (e.g. an API client id), as KEY=VALUE lines
      # in the optional BUILD_ENV secret; values stay masked in the logs.
      - name: Export project build environment
        env:
          BUILD_ENV: ${{ secrets.BUILD_ENV }}
        run: |
          if [ -n "$BUILD_ENV" ]; then
            printf '%s\n' "$BUILD_ENV" | grep -E '^[A-Za-z_][A-Za-z0-9_]*=' >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        run: ./gradlew ":$APP_MODULE:assembleRelease" --no-daemon --stacktrace
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      # gh release create attaches whatever file path it's given as-is, so the APK is
      # uploaded as a plain .apk release asset — never zipped.
      # Fails if the APK is unsigned and prints the certificate fingerprint (it must never change,
      # or phones refuse the update). R8's mapping.txt goes into the release too: it is what turns
      # the stack trace of a crash reported on this version back into readable code (retrace).
      - name: Verify signature and name the release assets
        id: apk
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          APP_NAME: ${{ github.event.repository.name }}
        run: |
          APK="$APP_MODULE/build/outputs/apk/release/$APP_MODULE-release.apk"
          if [ ! -f "$APK" ]; then
            echo "Signed APK not found at $APK" >&2
            exit 1
          fi
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)/apksigner
          # verify fails the step on an unsigned or broken APK; the output format varies with the
          # signature schemes in use ("Signer #1", "V2 Signer"), so the print is best effort.
          "$APKSIGNER" verify --print-certs "$APK" > "$RUNNER_TEMP/certs.txt"
          grep -E "certificate (DN|SHA-256 digest|SHA-1 digest)" "$RUNNER_TEMP/certs.txt" || cat "$RUNNER_TEMP/certs.txt"
          ASSET_PATH="${APP_NAME}-${VERSION_NAME}.apk"
          cp "$APK" "$ASSET_PATH"
          ASSETS="$ASSET_PATH"
          MAPPING="$APP_MODULE/build/outputs/mapping/release/mapping.txt"
          if [ -f "$MAPPING" ]; then
            cp "$MAPPING" "${APP_NAME}-${VERSION_NAME}-mapping.txt"
            ASSETS="$ASSETS ${APP_NAME}-${VERSION_NAME}-mapping.txt"
          fi
          echo "assets=$ASSETS" >> "$GITHUB_OUTPUT"

      # Release notes are always just the significant-change highlights for
      # this version, never the full changelog section. This project's
      # CHANGELOG.md convention (see docs/ci.md, "Setting up a new
      # project") is that every significant change is a top-level "- " bullet
      # leading with a bold one-line summary ("- **Summary.** ...elaboration"),
      # with nested "  - " bullets and wrapped continuation lines reserved for
      # elaboration — so extraction pulls just the bold lead-in of each
      # top-level bullet (or, for a bullet with no bold lead-in, its first
      # sentence, split on the first ". " followed by an uppercase letter to
      # avoid false-splitting on abbreviations), reflowing this file's
      # hard-wrapped prose back into a single line first. There is no
      # length-based judgment call: this always runs, for every release. A
      # section with no top-level bullets at all falls back to publishing the
      # whole section as-is instead — a structural fallback for a section with
      # nothing to extract, not a size cutoff.
      #
      # Either way the notes always end with a link back to CHANGELOG.md's
      # matching section. The link's #fragment reproduces GitHub's own
      # heading-anchor slug algorithm (lowercase; drop every character that
      # isn't a-z, 0-9, space, underscore, or hyphen; then turn spaces into
      # hyphens).
      - name: Extract changelog highlights
        id: changelog
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          awk -v ver="$VERSION_NAME" '
            BEGIN { esc = ver; gsub(/\./, "\\.", esc); pattern = "^## \\[" esc "\\]" }
            $0 ~ pattern { found = 1; print; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > /tmp/changelog_section.md

          if [ ! -s /tmp/changelog_section.md ]; then
            echo "No CHANGELOG.md section found for version $VERSION_NAME; using the whole file as release notes." >&2
            cp CHANGELOG.md release-notes.md
          else
            HEADING_LINE=$(head -1 /tmp/changelog_section.md)
            HEADING_TEXT=$(printf '%s\n' "$HEADING_LINE" | sed -E 's/^##[[:space:]]*//')
            SLUG=$(printf '%s' "$HEADING_TEXT" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9 _-]//g' | tr ' ' '-')
            CHANGELOG_LINK="https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md#${SLUG}"

            HIGHLIGHTS=$(awk '
              function flush() {
                if (buf == "") return
                if (buf ~ /^\*\*/) {
                  match(buf, /^\*\*[^*]+\*\*/)
                  out = substr(buf, RSTART, RLENGTH)
                } else {
                  out = buf
                  n = length(buf)
                  for (i = 1; i <= n - 2; i++) {
                    if (substr(buf, i, 1) == "." && substr(buf, i + 1, 1) == " " && substr(buf, i + 2, 1) ~ /[A-Z]/) {
                      out = substr(buf, 1, i)
                      break
                    }
                  }
                }
                print "- " out
                buf = ""
              }
              /^### / { flush(); next }
              /^- / { flush(); sub(/^- /, "", $0); buf = $0; nested = 0; next }
              /^[[:space:]]*$/ { flush(); nested = 0; next }
              /^  - / { nested = 1; next }
              nested { next }
              /^  / {
                line = $0
                sub(/^  +/, "", line)
                if (buf != "") buf = buf " " line
                next
              }
              { next }
              END { flush() }
            ' /tmp/changelog_section.md)

            {
              if [ -n "$HIGHLIGHTS" ]; then
                printf '%s\n' "$HIGHLIGHTS"
              else
                cat /tmp/changelog_section.md
              fi
              echo
              echo "See [CHANGELOG.md]($CHANGELOG_LINK) for the full changelog."
            } > release-notes.md
          fi

      - name: Create GitHub release
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          ASSETS: ${{ steps.apk.outputs.assets }}
          APP_NAME: ${{ github.event.repository.name }}
        run: |
          # ASSETS is a space-separated list of file names without spaces: split on purpose.
          # shellcheck disable=SC2086
          gh release create "$RELEASE_TAG" \
            $ASSETS \
            --repo "$GITHUB_REPOSITORY" \
            --title "$APP_NAME $RELEASE_TAG" \
            --notes-file release-notes.md

      # Only reached once the release above actually exists. Pushes with the credentials the
      # initial Checkout step already configured for this job (its RELEASE_PUSH_TOKEN input) —
      # a PAT, not the default GITHUB_TOKEN, so this commit authenticates as an actual repo admin
      # and can bypass main's branch protection.
      - name: Commit and push version bump
        env:
          NEW_VERSION: ${{ steps.version.outputs.name }}
          BUILD_FILE: ${{ env.APP_MODULE }}/build.gradle.kts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md "$BUILD_FILE"
          git commit -m "Cut release $NEW_VERSION"
          git push origin HEAD:main

      # Last, and only once the release is out (a failed run keeps the history for debugging; the
      # next successful one cleans up). Keeps the Actions history small: every completed run goes
      # except those of Release (the record of what was released) and the latest successful Build
      # APK (its APK and mapping.txt are what is on the phone). Matched by workflow file name, as the
      # callers name them. Never fails the run: if it can't delete (no `actions: write`), it warns.
      - name: Clean up old runs
        continue-on-error: true
        env:
          KEEP_ALL: release.yml
          KEEP_LATEST_SUCCESS: build-apk.yml
        run: |
          deleted=0
          while read -r wf_id wf_path; do
            wf_file=$(basename "$wf_path")
            [ "$wf_file" = "$KEEP_ALL" ] && continue
            kept=0
            # newest first; in-progress runs (this one) are not "completed", so they are never listed
            while read -r run_id conclusion; do
              if [ "$wf_file" = "$KEEP_LATEST_SUCCESS" ] && [ "$conclusion" = success ] && [ "$kept" = 0 ]; then
                kept=1
                continue
              fi
              if gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" >/dev/null 2>&1; then
                deleted=$((deleted + 1))
              else
                echo "::warning::Could not delete run ${run_id} of ${wf_file} (does the caller grant actions: write?)"
              fi
            done < <(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/workflows/${wf_id}/runs?status=completed&per_page=100" \
                       --jq '.workflow_runs[] | "\(.id) \(.conclusion)"')
          done < <(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/workflows" --jq '.workflows[] | "\(.id) \(.path)"')
          echo "Deleted ${deleted} old runs."
          echo "Deleted ${deleted} old workflow runs (Release runs and the latest successful Build APK kept)." >> "$GITHUB_STEP_SUMMARY"
